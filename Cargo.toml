# This crate is a standalone Cargo workspace: package metadata, dependency
# versions, profiles, the lockfile, and target/ all live here, so a fresh
# clone of this repository builds, tests, and installs on its own.
[package]
name = "hyusk_agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hyusk Contributors"]
repository = "https://github.com/hyusk/hyusk"
autobins = false

[[bin]]
name = "hyusk_agent"
path = "src/main.rs"

[[bin]]
name = "hyusk-workflows"
path = "src/bin/hyusk-workflows.rs"
required-features = ["workflow-editor"]

# Standalone workspace root. The parent Hyusk workspace excludes this
# directory, so builds, Cargo.lock, and target/ stay independent of it.
[workspace]
resolver = "2"

[features]
default = []
# The opt-in Android link: the TLS WebSocket server, the pairing file, and the
# model-facing `mobile` tool. Off by default, so a plain agent build neither
# compiles the transport nor touches a pairing file (P5). The Android app stays
# in the repository and is not built here.
mobile = ["dep:rustls", "dep:tokio-rustls", "dep:hmac", "dep:sha2", "dep:rand"]
# The native GTK4/libadwaita workflow editor. Off by default: an agent build
# must not compile the toolkit, and `scripts/install-workflow-app.sh` builds
# the bin with this feature. `platform_tests` in `src/main.rs` guards the
# wiring.
workflow-editor = ["dep:gtk4", "dep:libadwaita"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tokio-util = "0.7"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
tokio-tungstenite = "0.21"
# Only the `mobile` link feature needs these; the browser tool uses
# `tokio-tungstenite` for CDP, but the TLS server and its HMAC pairing live
# behind the feature.
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
whisper-rs = "0.16"
cpal = "0.15"       # Audio input/output
eframe = "0.33"
egui = "0.33"
livekit-wakeword = "0.1.3"
nnnoiseless = { version = "0.5", default-features = false }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid", "json"] }
aws-config = { version = "1.8", features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-bedrockruntime = "1.143"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", features = ["wayland"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "screenshot"] }
enumflags2 = "0.7"
xkbcommon = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Only the `hyusk-workflows` bin needs these; the `workflow-editor` feature
# turns them on, so a plain agent build never compiles the toolkit.
gtk4 = { version = "0.11.4", optional = true }
libadwaita = { version = "0.9.2", features = ["v1_5"], optional = true }

# Linux is the only supported target. `src/main.rs` refuses to compile
# elsewhere with one explicit `compile_error!`, so no dependency here needs a
# fallback for another platform.

# Keep dependency code optimized in debug builds so ONNX wake-word feature
# extraction stays fast enough for realtime detection. The crate itself stays
# unoptimized for quick incremental compiles.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
