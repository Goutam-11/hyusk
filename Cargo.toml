# This crate is a standalone Cargo workspace: package metadata, dependency
# versions, profiles, the lockfile, and target/ all live here, so a fresh
# clone of this repository builds, tests, and installs on its own.
[package]
name = "hyusk_agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hyusk Contributors"]
repository = "https://github.com/hyusk/hyusk"
autobins = false

[[bin]]
name = "hyusk_agent"
path = "src/main.rs"

[[bin]]
name = "hyusk-shell-agent"
path = "src/bin/hyusk-shell-agent.rs"

[[bin]]
name = "hyusk-workflows"
path = "src/bin/hyusk-workflows.rs"

# Standalone workspace root. The parent Hyusk workspace excludes this
# directory, so builds, Cargo.lock, and target/ stay independent of it.
[workspace]
resolver = "2"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tokio-util = "0.7"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
tokio-tungstenite = "0.21"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
whisper-rs = "0.16"
cpal = "0.15"       # Audio input/output
eframe = "0.33"
egui = "0.33"
livekit-wakeword = "0.1.3"
nnnoiseless = { version = "0.5", default-features = false }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid", "json"] }
aws-config = { version = "1.8", features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-bedrockruntime = "1.143"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", features = ["wayland"] }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "screenshot"] }
enumflags2 = "0.7"
xkbcommon = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }
gtk4 = "0.11.4"
libadwaita = { version = "0.9.2", features = ["v1_5"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
enigo = "0.6.1"

# Keep dependency code optimized in debug builds so ONNX wake-word feature
# extraction stays fast enough for realtime detection. The crate itself stays
# unoptimized for quick incremental compiles.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
