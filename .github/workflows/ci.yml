name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    # A cold cache builds GTK4, the AWS SDK, whisper.cpp, and ONNX Runtime.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # cpal needs ALSA, eframe/winit need the X11 and Wayland clients, the
      # settings editor needs GTK4/libadwaita, and whisper.cpp and aws-lc are
      # built by their crates through cmake and bindgen.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang libclang-dev pkg-config \
            libasound2-dev libxkbcommon-dev \
            libgtk-4-dev libadwaita-1-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libwayland-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Warnings are reported but do not fail the job; the crate has a small
      # number of pre-existing lint warnings.
      - name: Run clippy
        run: cargo clippy --all-targets

      # Portal, live-CDP, Whisper-inference, and GUI workflow checks are
      # #[ignore]d because they need a desktop session.
      - name: Run tests
        run: cargo test --all-targets
