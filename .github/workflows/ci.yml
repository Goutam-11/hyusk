name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    # A cold cache builds the AWS SDK, whisper.cpp, and ONNX Runtime, plus GTK4
    # for the workflow editor feature build below.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # cpal needs ALSA, eframe/winit need the X11 and Wayland clients, the
      # workflow editor feature build needs GTK4/libadwaita, and whisper.cpp and
      # aws-lc are built by their crates through cmake and bindgen.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang libclang-dev pkg-config \
            libasound2-dev libxkbcommon-dev \
            libgtk-4-dev libadwaita-1-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libwayland-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Warnings are reported but do not fail the job; the crate has a small
      # number of pre-existing lint warnings.
      - name: Run clippy
        run: cargo clippy --all-targets

      # The default suite skips the GTK workflow editor, which is behind the
      # `workflow-editor` feature. Portal, live-CDP, Whisper-inference, and GUI
      # workflow checks are #[ignore]d because they need a desktop session.
      - name: Run tests
        run: cargo test --all-targets

      # One feature-enabled build, so the editor is compiled and its tests run
      # while the default build above never touches GTK4.
      - name: Build and test the workflow editor feature
        run: |
          cargo check --all-targets --features workflow-editor
          cargo test --bin hyusk-workflows --features workflow-editor

      # The mobile link is behind its own feature (P5), so this step compiles
      # the TLS transport, the pairing code, and the mobile tool and runs their
      # tests; the default build above has none of them.
      - name: Build and test the mobile link feature
        run: |
          cargo check --all-targets --features mobile
          cargo test --bin hyusk_agent --features mobile

      # Nova Sonic is behind the `sonic` feature (P6): this compiles the AWS
      # live-audio path and runs its tests while the default build skips both.
      - name: Build and test the Nova Sonic feature
        run: |
          cargo check --all-targets --features sonic
          cargo test --bin hyusk_agent --features sonic
