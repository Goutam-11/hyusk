<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Where Hyusk appears</title>
  <desc id="description">Three ways to use Hyusk: the GNOME top-bar indicator, the Noctalia bar widget on niri, Hyprland, or Sway, and a terminal or keybind through hyusk_agent ctl. The cards are schematic, not screenshots.</desc>
  <rect width="1200" height="300" rx="24" fill="#0b0e13"/>
  <text x="60" y="58" fill="#f4f2ed" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="720">Meet Hyusk where you already work</text>
  <text x="60" y="86" fill="#8f8a80" font-family="Inter, system-ui, sans-serif" font-size="15">One agent, three surfaces. No separate app window is required.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="60" y="118" width="340" height="140" rx="18" fill="#12161d" stroke="#262d38"/>
    <rect x="84" y="142" width="292" height="30" rx="15" fill="#1a202a"/>
    <circle cx="102" cy="157" r="5" fill="#f4f2ed"/>
    <text x="116" y="162" fill="#d8d3c9" font-size="12">Hyusk</text>
    <rect x="300" y="149" width="28" height="16" rx="8" fill="#78e6aa" opacity=".85"/>
    <text x="84" y="206" fill="#f4f2ed" font-size="18" font-weight="700">GNOME top bar</text>
    <text x="84" y="232" fill="#9c968b" font-size="14">Indicator, cards, approvals</text>

    <rect x="430" y="118" width="340" height="140" rx="18" fill="#12161d" stroke="#262d38"/>
    <rect x="454" y="142" width="292" height="30" rx="15" fill="#1a202a"/>
    <circle cx="472" cy="157" r="5" fill="#82d2ff"/>
    <circle cx="490" cy="157" r="5" fill="#ffaa6e"/>
    <circle cx="508" cy="157" r="5" fill="#f4f2ed"/>
    <rect x="672" y="149" width="56" height="16" rx="8" fill="#82d2ff" opacity=".75"/>
    <text x="454" y="206" fill="#f4f2ed" font-size="18" font-weight="700">Noctalia bar</text>
    <text x="454" y="232" fill="#9c968b" font-size="14">niri · Hyprland · Sway</text>

    <rect x="800" y="118" width="340" height="140" rx="18" fill="#12161d" stroke="#262d38"/>
    <rect x="824" y="142" width="292" height="52" rx="10" fill="#080a0e" stroke="#232a35"/>
    <text x="840" y="162" fill="#78e6aa" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">$</text>
    <text x="854" y="162" fill="#d8d3c9" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">hyusk_agent ctl pause</text>
    <text x="840" y="182" fill="#6f6a60" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">sent stop_listening</text>
    <text x="824" y="222" fill="#f4f2ed" font-size="18" font-weight="700">Terminal or keybind</text>
    <text x="824" y="246" fill="#9c968b" font-size="14">Type, or bind a key</text>
  </g>
  <text x="60" y="286" fill="#5f5a52" font-family="Inter, system-ui, sans-serif" font-size="11">Schematic surfaces, not screenshots.</text>
</svg>
